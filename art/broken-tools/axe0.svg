<svg width="56" height="104" xmlns="http://www.w3.org/2000/svg" viewBox="-40 -98 56 104">
<!-- Elder Oswin's blunt old axe, before it's mended: a dull, chipped head hanging crooked on frayed twine, and a bare,
     cracked handle. The grip (the frame's anchor) is at the origin. -->
<defs>
<linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#7a5a40"/><stop offset=".45" stop-color="#8e6a4a"/><stop offset="1" stop-color="#5c4230"/></linearGradient>
<linearGradient id="iron" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a958d"/><stop offset="1" stop-color="#6c6760"/></linearGradient>
</defs>
<!-- handle: worn, slightly bowed, split near the top -->
<path d="M-3.2 4 C-3.6 -20 -2.6 -50 -3.4 -78 L3.2 -79 C3.6 -50 3.8 -20 3.2 4 Z" fill="url(#wood)" stroke="#3a2448" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M-.4 -40 L.6 -52 L-.8 -60" fill="none" stroke="#3a2448" stroke-width="1" stroke-linecap="round"/>
<path d="M-1.6 -12 L-1 -24" fill="none" stroke="#4a3426" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
<path d="M1.4 -66 L2.2 -74" fill="none" stroke="#4a3426" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
<!-- the head, slipped down and tilted, with a notch out of the blade and a crack -->
<g transform="rotate(-14 0 -70) translate(0 -70) scale(1.3) translate(0 70)">
<path d="M3 -78 L-12 -80 C-20 -84 -27 -84 -29 -78 C-31 -70 -31 -62 -28 -56 L-24 -57 L-26 -62 L-22 -63 C-20 -60 -16 -59 -12 -61 L3 -63 Z" fill="url(#iron)" stroke="#3a2448" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M-27 -78 C-28 -71 -28 -64 -26 -59" fill="none" stroke="#c9c4ba" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
<path d="M-15 -79 L-17 -73 L-14 -69 L-16 -64" fill="none" stroke="#3a2448" stroke-width="1" stroke-linecap="round"/>
<g fill="#8a5a3a" opacity=".55"><circle cx="-6" cy="-74" r="1.6"/><circle cx="-20" cy="-66" r="1.2"/><circle cx="-3" cy="-67" r="1"/></g>
</g>
<!-- frayed twine holding it on, loose ends hanging -->
<g fill="none" stroke="#b49a6a" stroke-width="2.2" stroke-linecap="round">
<path d="M-4.4 -66 L4.4 -69"/><path d="M-4.4 -62 L4.2 -65"/>
<path d="M4.2 -65 C7 -63 7.5 -60 6.4 -56"/><path d="M4.4 -69 C8 -68 9.5 -64 9 -60"/>
</g>
<g fill="none" stroke="#3a2448" stroke-width=".5" opacity=".6"><path d="M-4.4 -66 L4.4 -69"/><path d="M-4.4 -62 L4.2 -65"/></g>
</svg>
