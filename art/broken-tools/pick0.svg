<svg width="82" height="98" xmlns="http://www.w3.org/2000/svg" viewBox="-44 -92 82 98">
<!-- Elder Oswin's chipped old pick, before it's mended: a dull head with a snapped-off point, wobbling crooked on frayed
     twine, and a bare, cracked handle. The grip (the frame's anchor) is at the origin. -->
<defs>
<linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#7a5a40"/><stop offset=".45" stop-color="#8e6a4a"/><stop offset="1" stop-color="#5c4230"/></linearGradient>
<linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a958d"/><stop offset="1" stop-color="#66615b"/></linearGradient>
</defs>
<path d="M-3.2 4 C-3.6 -20 -2.6 -50 -3.4 -74 L3.2 -75 C3.6 -50 3.8 -20 3.2 4 Z" fill="url(#wood)" stroke="#3a2448" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M-.6 -36 L.6 -48 L-.6 -56" fill="none" stroke="#3a2448" stroke-width="1" stroke-linecap="round"/>
<path d="M1.4 -14 L2 -26" fill="none" stroke="#4a3426" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
<!-- the head, tipped over: the left point snapped short, the right one worn blunt -->
<g transform="rotate(9 0 -72) translate(0 -70) scale(1.12 1.35) translate(0 70)">
<path d="M-30 -60 C-22 -72 -10 -78 0 -79 C12 -78 24 -71 33 -58 C26 -64 14 -68 3 -68 L-3 -68 C-12 -68 -20 -66 -26 -62 L-27 -58 L-31 -57 Z" fill="url(#iron)" stroke="#3a2448" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M-22 -70 C-14 -76 -4 -78 6 -77" fill="none" stroke="#c9c4ba" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
<path d="M14 -75 L12 -70 L15 -67" fill="none" stroke="#3a2448" stroke-width="1" stroke-linecap="round"/>
<g fill="#8a5a3a" opacity=".55"><circle cx="-14" cy="-71" r="1.4"/><circle cx="20" cy="-68" r="1.2"/></g>
</g>
<!-- the snapped tip lying loose just below -->
<path d="M-38 -48 L-33 -52 L-31 -47 Z" fill="#7d7870" stroke="#3a2448" stroke-width="1.2" stroke-linejoin="round"/>
<g fill="none" stroke="#b49a6a" stroke-width="2.2" stroke-linecap="round">
<path d="M-4.4 -64 L4.4 -66"/><path d="M-4.4 -60 L4.2 -62"/>
<path d="M4.2 -62 C7 -60 7.5 -57 6.4 -53"/><path d="M4.4 -66 C8 -65 9.5 -61 9 -57"/>
</g>
<g fill="none" stroke="#3a2448" stroke-width=".5" opacity=".6"><path d="M-4.4 -64 L4.4 -66"/><path d="M-4.4 -60 L4.2 -62"/></g>
</svg>
