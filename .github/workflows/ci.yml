name: CI

# Routine changes get fast checks. Exhaustive browser regression and balance reports run only for release PRs
# into main or via Run workflow (select dev for a batch checkpoint). See README's verification policy.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation and CI-only changes skip the build and browser test. Skipped jobs count as passing for the checks
  # main requires, so those pull requests can still merge.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.diff.outputs.game }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: diff
        run: bun run scripts/changes.ts "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"

  check:
    name: Typecheck, tests and build
    needs: changes
    if: needs.changes.outputs.game == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --isolate
      - run: bun run build
      - run: bun run balance:check

  e2e:
    name: Browser smoke test
    needs: changes
    if: needs.changes.outputs.game == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium-headless-shell
      - run: bun run e2e:fast

  regression:
    name: Full browser regression and balance
    needs: changes
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.game == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium-headless-shell
      - run: bun run tests/e2e/sprite-effects.ts
      - run: bun run e2e:full --shots
      - run: bun run e2e:playtest
      - run: bun run tests/e2e/crafting.ts
      - run: bun run tests/e2e/icons3d.ts
      - run: bun run balance --seeds 3
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: balance-report
          path: sim/out/balance/
      # Each scenario's last screen, to see what went wrong.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: tests/e2e/out/

  release:
    name: Version bump and patch notes
    needs: [changes, regression]
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Keep the existing release check red if full regression fails; docs-only PRs may skip regression.
      - if: needs.changes.result != 'success' || (needs.changes.outputs.game == 'true' && needs.regression.result != 'success')
        run: |
          echo 'Release requires a successful change check and full regression for game changes.'
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-release.ts origin/main
